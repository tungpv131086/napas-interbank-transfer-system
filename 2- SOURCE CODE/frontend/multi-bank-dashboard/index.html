<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Bank Dashboard - NAPAS Simulation</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom Dashboard CSS -->
  <link href="css/dashboard.css" rel="stylesheet">
</head>
<body>
  <div class="container-fluid">
    <!-- Global Header -->
    <div class="dashboard-header">
      <div class="row align-items-center">
        <div class="col">
          <h1 class="mb-0">🏦 Multi-Bank Dashboard</h1>
          <p class="mb-0 text-muted">Manage multiple bank accounts with real-time updates via NAPAS</p>
        </div>
        <div class="col-auto d-flex align-items-center gap-3">
          <!-- Language Selector -->
          <div class="language-selector">
            <select id="languageSelect" class="form-select form-select-sm" aria-label="Select language">
              <option value="en">🇬🇧 English</option>
              <option value="vi">🇻🇳 Tiếng Việt</option>
            </select>
          </div>

          <div id="globalConnectionStatus" class="global-status">
            <!-- Connection status indicators will be inserted here -->
          </div>
        </div>
      </div>
    </div>

    <!-- Bank Tabs Navigation -->
    <ul class="nav nav-tabs bank-tabs" id="bankTabs" role="tablist">
      <!-- Tabs will be dynamically generated by UI Manager -->
    </ul>

    <!-- Tab Content Panels -->
    <div class="tab-content" id="bankTabContent">
      <!-- Panels will be dynamically generated by UI Manager -->
    </div>

    <!-- Toast Container for Notifications -->
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer">
      <!-- Toast notifications will be inserted here -->
    </div>
  </div>

  <!-- Bootstrap JS Bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- SignalR Client Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>

  <!-- Application Initialization -->
  <script type="module">
    import { StateManager } from './js/state-manager.js';
    import { BankManager } from './js/bank-manager.js';
    import { SignalRManager } from './js/signalr-manager.js';
    import { UIManager } from './js/ui-manager.js';
    import { I18nManager } from './js/i18n.js';

    // Initialize application on DOM ready
    document.addEventListener('DOMContentLoaded', async () => {
      console.log('=== Multi-Bank Dashboard Starting ===');

      // Create and initialize i18n manager
      const i18n = new I18nManager();
      await i18n.initialize();
      console.log('✓ i18n Manager initialized');

      // Create state manager
      const stateManager = new StateManager();
      console.log('✓ State Manager initialized');

      // Create SignalR manager
      const signalRManager = new SignalRManager();
      console.log('✓ SignalR Manager initialized');

      // Create bank managers for each bank
      const bankManagers = {};
      const state = stateManager.getState();

      for (const bankCode in state.banks) {
        const config = state.banks[bankCode].config;
        bankManagers[bankCode] = new BankManager(bankCode, config);
        console.log(`✓ Bank Manager created for ${config.name}`);
      }

      // Create UI manager and initialize
      const uiManager = new UIManager(stateManager, bankManagers, signalRManager, i18n);
      console.log('✓ UI Manager initialized');

      // Initialize the UI
      await uiManager.initialize();
      console.log('✓ Dashboard UI rendered');

      // Setup language selector
      const languageSelect = document.getElementById('languageSelect');
      languageSelect.value = i18n.getCurrentLanguage();
      languageSelect.addEventListener('change', async (e) => {
        await i18n.changeLanguage(e.target.value);
      });

      console.log('=== Multi-Bank Dashboard Ready ===');

      // Expose to window for debugging
      window.dashboard = {
        state: stateManager,
        banks: bankManagers,
        signalR: signalRManager,
        ui: uiManager,
        i18n: i18n
      };
    });
  </script>
</body>
</html>
